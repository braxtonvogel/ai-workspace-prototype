    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'ui-monospace', 'Consolas', 'monospace'],

          ink: Object.fromEntries([950, 900, 850, 800, 700, 600].map((k) => [k, `rgb(var(--ink-${k}) / <alpha-value>)`])),
          neutral: Object.fromEntries([100, 200, 300, 400, 500, 600].map((k) => [k, `rgb(var(--n-${k}) / <alpha-value>)`])),
          fg: 'rgb(var(--fg) / <alpha-value>)',
          accent: '#2f5bea',
        },
      },
    },
  };

<script>
  /* apply the saved theme before first paint (dark is the default) */
  (function () {
    try { if (localStorage.getItem('trio-theme') === 'light') document.documentElement.classList.add('light'); } catch (e) {}
  })();

<style>

  @keyframes flyOut { from { transform: none; opacity: 1 } to { transform: translate(var(--fx, 0px), var(--fy, -60px)) scale(.34); opacity: 0 } }
  @keyframes bubbleIn { from { opacity: 0; transform: scale(.86) translateY(-6px) } to { opacity: 1; transform: none } }
  @keyframes bubbleOut { to { opacity: 0; transform: scale(.92) translateY(-4px) } }
  @keyframes petBounce {

    14% { transform: translateY(-8px) scale(.94,1.08); animation-timing-function: cubic-bezier(.5,0,.9,.6) }
    28% { transform: translateY(0) scale(1.1,.88); animation-timing-function: cubic-bezier(.2,.8,.3,1) }
    40% { transform: translateY(-3.5px) scale(.98,1.03); animation-timing-function: cubic-bezier(.5,0,.9,.6) }
    52% { transform: translateY(0) scale(1.03,.97) }
    62%, 100% { transform: translateY(0) scale(1,1) }
  }
  @keyframes petFloat { 50% { transform: translateY(-4px) } }
  @keyframes outlineIn { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: none } }
  @keyframes orb { 50% { transform: scale(1.08); box-shadow: 0 0 44px #3b6df0aa } }
  @keyframes ring { 0%{transform:scale(1);opacity:.55} 100%{transform:scale(1.9);opacity:0} }
  @keyframes drift { 0%{transform:translate(0,0)} 25%{transform:translate(70px,-40px)} 50%{transform:translate(20px,50px)} 75%{transform:translate(-60px,20px)} 100%{transform:translate(0,0)} }
  @keyframes dots { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  @keyframes fadeUp { from{opacity:0;transform:translate(-50%,8px)} to{opacity:1;transform:translate(-50%,0)} }
  .fly-in { animation: flyIn .32s cubic-bezier(.2,.9,.3,1.12) both; }
  .fly-out { animation: flyOut .26s cubic-bezier(.45,0,.7,.2) forwards; }
  .bubble-in { transform-origin: top right; animation: bubbleIn .24s cubic-bezier(.2,.9,.3,1.1) .1s both; }
  .bubble-out { transform-origin: top right; animation: bubbleOut .18s ease-in forwards; }
  .outline-in { animation: outlineIn .2s ease-out both; }

  .theme-fade, .theme-fade * { transition: background-color .25s ease, border-color .25s ease, color .25s ease; }

  .orb-ring { animation: ring 2.4s ease-out infinite; }

  .scroll-mask { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 22px); mask-image: linear-gradient(to bottom, transparent, #000 22px); }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ------------------------------------------------------------------ */
/* Icons                                                               */
/* ------------------------------------------------------------------ */
const PATHS = {
  edit: <><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z" /></>,

  chevUp: <path d="m6 15 6-6 6 6" />,
  chevDown: <path d="m6 9 6 6 6-6" />,

  tag: <><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9Z" /><circle cx="8" cy="8" r="1.2" /></>,
  gear: <><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" /></>,
  puzzle: <path d="M19.4 11H18V8a2 2 0 0 0-2-2h-3V4.6a2.6 2.6 0 0 0-5.2 0V6H5a2 2 0 0 0-2 2v3h1.4a2.6 2.6 0 0 1 0 5.2H3V19a2 2 0 0 0 2 2h3v-1.4a2.6 2.6 0 0 1 5.2 0V21h3a2 2 0 0 0 2-2v-3h1.4a2.6 2.6 0 0 0 0-5.2Z" />,
  clip: <path d="m21 11.5-8.6 8.6a5 5 0 0 1-7-7l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9" />,
  at: <><circle cx="12" cy="12" r="3.5" /><path d="M15.5 8.5v4.2a2.3 2.3 0 0 0 4.5 0V12a8 8 0 1 0-3.2 6.4" /></>,
  mic: <><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></>,
  send: <path d="M21 3 10 14M21 3l-7 18-4-7-7-4Z" />,
  arrowL: <path d="M19 12H5m6-6-6 6 6 6" />,
  arrowR: <path d="M5 12h14m-6-6 6 6-6 6" />,
  lock: <><rect x="5" y="11" width="14" height="9" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></>,
  kebab: <><circle cx="12" cy="5" r="1.2" fill="currentColor" /><circle cx="12" cy="12" r="1.2" fill="currentColor" /><circle cx="12" cy="19" r="1.2" fill="currentColor" /></>,
  plus: <path d="M12 5v14M5 12h14" />,
  x: <path d="m6 6 12 12M18 6 6 18" />,
  scatter: <><circle cx="6" cy="17" r="1.4" fill="currentColor" /><circle cx="10" cy="8" r="1.4" fill="currentColor" /><circle cx="15" cy="13" r="1.4" fill="currentColor" /><circle cx="18" cy="6" r="1.4" fill="currentColor" /><circle cx="19" cy="18" r="1.4" fill="currentColor" /></>,
  share: <><circle cx="18" cy="5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="19" r="2.5" /><path d="m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6" /></>,
  file: <><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z" /><path d="M14 3v5h5" /></>,
  code: <path d="m8 8-4 4 4 4M16 8l4 4-4 4" />,
  branch: <><circle cx="6" cy="6" r="2" /><circle cx="6" cy="18" r="2" /><circle cx="18" cy="8" r="2" /><path d="M6 8v8M18 10c0 4-6 3-10 6" /></>,
  user: <><circle cx="12" cy="8" r="3.5" /><path d="M5 20a7 7 0 0 1 14 0" /></>,
  minus: <path d="M5 12h14" />,
  check: <path d="m5 12 5 5 9-10" />,
  sun: <><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></>,
  moon: <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />,
  chevsL: <path d="m11 17-5-5 5-5M18 17l-5-5 5-5" />,
  chevsR: <path d="m6 17 5-5-5-5M13 17l5-5-5-5" />,
  command: <path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3Z" />,
};
function Ico({ n, size = 20, sw = 1.6, className = '' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {PATHS[n]}
    </svg>
  );
}
function CursorIcon({ className = '' }) {
  return (
    <svg width="26" height="26" viewBox="0 0 24 24" className={className}>
      <path d="M4 2.5 19 10l-7 2-2.2 7.5Z" fill="#9ec0ff" stroke="#1a2f7a" strokeWidth="1.2" strokeLinejoin="round" />
    </svg>
  );
}

/* ------------------------------------------------------------------ */
/* Characters (images embedded as base64 at the bottom of the file)    */
/* ------------------------------------------------------------------ */
function Char({ id, size = 32 }) {
  return (
    <img src={window.TRIO_IMG[id]} alt="" draggable="false" width={size} height={size}
      className={`block select-none object-contain ${id === 'grok' ? 'char-grok' : ''}`}
      style={{ width: size, height: size }} />
  );
}

/* ------------------------------------------------------------------ */
/* Models + fake replies                                               */
/* ------------------------------------------------------------------ */
const COL = { grok: '#f4f4f5', gpt: '#2f63e8', claude: '#e2733f' };
const MODELS = {
  grok: { name: 'Grok Bot' },
  gpt: { name: 'ChatGPT' },
  claude: { name: 'Claude' },
};
const MODEL_KEYS = ['grok', 'gpt', 'claude'];
const snippet = (t) => { const s = t.trim().replace(/\s+/g, ' '); return s.length > 48 ? s.slice(0, 45) + '…' : s; };
let replyCount = 0;
function fakeReply(m, text) {
  const s = snippet(text);
  replyCount++;
  if (m === 'grok')
    return [`Honestly? "${s}" comes down to one thing: keep it small and ship. Measure after, not before. Want me to rough it out?`,
      `Quick take on "${s}": skip the over-engineering, do the boring version first, and tell me where it hurts.`][replyCount % 2];
  if (m === 'gpt')
    return `Great question. Here's a quick breakdown of "${s}":\n1. Clarify the goal\n2. List the constraints\n3. Pick the simplest option that works\n\nWant me to expand on any of these?`;
  return `I'd approach "${s}" in two steps: isolate the smallest reproducible piece, then iterate.\n\n\`\`\`js\n// sketch\nconst result = await run(input);\nconsole.log(result);\n\`\`\`\nHappy to go through it line by line.`;
}
function resolveModel(sel, text) {
  if (sel !== 'auto') return sel;
  if (/code|bug|api|error|fix|react|function/i.test(text)) return 'claude';
  if (/plan|trip|flight|image|summar|voice|schedule/i.test(text)) return 'gpt';
  return MODEL_KEYS[replyCount % 3];
}

/* ------------------------------------------------------------------ */
/* Graph data + force simulation (no libraries)                        */
/* ------------------------------------------------------------------ */
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const dateLabel = (days) => new Date(2026, 10, 11 - days).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

// chat model: 'grok' | 'gpt' | 'claude', or 'a+b' for a mixed chat (drawn half-and-half)
const PROJECTS = [
  { id: 'portfolio', label: 'Portfolio site', chats: [['Hero section redesign', 'grok', 2], ['Lighthouse score audit', 'grok', 5], ['Dark mode toggle', 'claude', 9], ['Project cards grid', 'grok+gpt', 12], ['SEO meta tags', 'grok', 15], ['Contact form validation', 'gpt', 20], ['Deploy to Vercel', 'grok', 26]] },
  { id: 'offsite', label: 'Offsite trip', chats: [['Offsite flight plan', 'gpt', 1], ['Hotel shortlist', 'gpt', 3], ['Agenda draft', 'grok', 4], ['Budget estimate', 'gpt+claude', 6], ['Dinner options', 'gpt', 8], ['Packing list', 'gpt', 10]] },
  { id: 'octopus', label: 'Octopus training', lines: ['Octopus', 'training'], chats: [['Training roadmap', 'gpt', 2], ['Module 3 recap', 'claude', 7], ['Quiz prep', 'claude', 11], ['Lab notes', 'gpt', 18], ['Cert checklist', 'gpt+claude', 24], ['Study guide', 'claude', 29], ['Practice exam', 'gpt', 33]] },
  { id: 'ibm', label: 'IBM Bob', chats: [['Bob agent setup', 'claude', 1], ['Watsonx prompt tuning', 'claude+gpt', 4], ['Mainframe basics', 'claude', 8], ['Onboarding checklist', 'claude', 12], ['Sprint demo script', 'claude', 16], ['COBOL refresher', 'grok', 22]] },
  { id: 'shsu', label: 'SHSU', chats: [['Data structures notes', 'gpt', 3], ['Calc II homework', 'gpt', 6], ['Study schedule', 'grok', 9], ['Group project plan', 'grok+gpt', 14], ['Essay outline', 'grok', 19], ['Lab 2 write-up', 'gpt', 21], ['Finals prep', 'grok', 28]] },
  { id: 'clear', label: 'Clear Measure', lines: ['Clear', 'Measure'], chats: [['Apprentice onboarding', 'gpt', 2], ['Weekly standup notes', 'gpt', 9], ['Code review prep', 'gpt', 13], ['Testing strategy', 'claude', 17], ['Pairing notes', 'gpt+claude', 7], ['Retro summary', 'grok', 20]] },
  { id: 'taskflow', label: 'TaskFlow', chats: [['TaskFlow cold start fix', 'claude', 0], ['TaskFlow API bug', 'claude', 5], ['Docker build', 'grok', 3], ['Seed data script', 'grok', 6], ['README polish', 'grok', 10], ['Auth middleware', 'gpt', 12]] },
];
const PRIORITY = ['gpt', 'grok', 'claude'];
const byPriority = (list) => [...list].sort((x, y) => PRIORITY.indexOf(x) - PRIORITY.indexOf(y));

// the AI used most in a project; two AIs used about equally -> half-and-half
function dominantAI(chats) {
  const t = { grok: 0, gpt: 0, claude: 0 };
  chats.forEach(([, m]) => { const ms = m.split('+'); ms.forEach((x) => { t[x] += 1 / ms.length; }); });
  const s = Object.entries(t).sort((a, b) => b[1] - a[1]);
  if (s[1][1] >= s[0][1] * 0.85) { const pair = byPriority([s[0][0], s[1][0]]); return { model: pair[0], pair }; }
  return { model: s[0][0] };
}

const RING_R = 255;
function buildGraph() {
  const rnd = mulberry(5);
  const nodes = [], links = [], byId = {};
  const add = (n) => { Object.assign(n, { vx: 0, vy: 0 }); nodes.push(n); byId[n.id] = n; return n; };
  const link = (a, b, rest, k, type) => links.push({ a, b, rest, k, type });

  const me = add({ id: 'core', kind: 'center', label: 'Me', model: 'grok', x: 0, y: 0, r: 11, q: 0, pinned: true });
  PROJECTS.forEach((p, i) => {
    const a = (i / PROJECTS.length) * Math.PI * 2 - Math.PI / 2;
    const tx = Math.cos(a) * RING_R, ty = Math.sin(a) * RING_R;
    const dom = dominantAI(p.chats);
    const hub = add({ id: p.id, kind: 'hub', label: p.label, lines: p.lines || [p.label], model: dom.model, pair: dom.pair, x: tx, y: ty, tx, ty, r: 20, q: 2600, count: p.chats.length });
    link(hub, me, RING_R, 0.02, 'spoke');
    const leaves = [];
    p.chats.forEach(([title, m, days], j) => {
      const ms = byPriority(m.split('+'));
      const la = a + (j / p.chats.length) * Math.PI * 2 + 0.3;
      const leaf = add({ id: `${p.id}-${j}`, kind: 'chat', title, project: p.label, model: ms[0], pair: ms.length > 1 ? ms : undefined, days, date: dateLabel(days), x: tx + Math.cos(la) * 62, y: ty + Math.sin(la) * 62, r: 6.5, q: 520, hub: p.id });
      link(leaf, hub, 62, 0.14, 'chat');
      leaves.push(leaf);
    });
    // related chats inside a project get an even fainter link
    leaves.forEach((l, j) => { if (rnd() < 0.55) link(l, leaves[(j + 2) % leaves.length], 70, 0.01, 'related'); });
  });

  const g = { nodes, links, byId, alpha: 1, view: { x: 0, y: 0, k: 1 }, hover: null, press: null, fitted: false };
  for (let i = 0; i < 320; i++) tick(g);
  g.alpha = 0.2;
  return g;
}

function tick(g) {
  const { nodes, links } = g;
  const a = g.alpha;
  const dragged = g.press && g.press.moved ? g.press.n : null;
  for (let i = 0; i < nodes.length; i++) {
    const ni = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const nj = nodes[j];
      let dx = nj.x - ni.x, dy = nj.y - ni.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 60000) continue;
      const s = Math.sqrt(ni.q * nj.q);
      if (!s) continue;
      if (d2 < 16) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 16; }
      const d = Math.sqrt(d2);
      const f = Math.min((s / d2) * a, 3);
      const fx = (dx / d) * f, fy = (dy / d) * f;
      ni.vx -= fx; ni.vy -= fy; nj.vx += fx; nj.vy += fy;
    }
  }
  for (const l of links) {
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = ((d - l.rest) / d) * l.k * a;
    const fx = dx * f, fy = dy * f;
    l.a.vx += fx; l.a.vy += fy; l.b.vx -= fx; l.b.vy -= fy;
  }
  for (const n of nodes) {
    if (n.kind === 'hub') { n.vx += (n.tx - n.x) * 0.09 * a; n.vy += (n.ty - n.y) * 0.09 * a; }
    if (n.pinned || n === dragged) { n.vx = n.vy = 0; continue; }
    n.vx *= 0.78; n.vy *= 0.78;
    n.x += n.vx; n.y += n.vy;
  }
  g.alpha *= 0.985;
}

function fitView(g, w, h) {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const n of g.nodes) { x0 = Math.min(x0, n.x); x1 = Math.max(x1, n.x); y0 = Math.min(y0, n.y); y1 = Math.max(y1, n.y); }
  const k = clamp(Math.min(w / (x1 - x0 + 130), h / (y1 - y0 + 170)), 0.4, 1.4);
  g.view = { k, x: -((x0 + x1) / 2) * k, y: -((y0 + y1) / 2) * k };
}
let GRAPH = null;
const getGraph = () => (GRAPH ||= buildGraph());

const visAlpha = (n, o) => {
  let a = 1;
  const leaf = n.kind === 'chat';
  if (o.filter === 'projects' && leaf) a = 0.12;
  if (o.filter === 'ai' && (n.kind === 'hub' || n.kind === 'center')) a = 0.25;
  if (o.range !== 'any' && leaf && n.days > (o.range === '7' ? 7 : 30)) a = Math.min(a, 0.1);
  return a;
};
const inFocus = (n, focus) => !focus || n.kind === 'center' || n.id === focus || n.hub === focus;
const modelName = (n) => (n.pair ? `Multi-AI (${MODELS[n.pair[0]].name} + ${MODELS[n.pair[1]].name})` : MODELS[n.model].name);
const tipText = (n) => {
  if (n.kind === 'center') return 'Me · connects all your projects';
  if (n.kind === 'hub') return `${n.label} · project · ${n.count} chats · mostly ${n.pair ? `${MODELS[n.pair[0]].name} & ${MODELS[n.pair[1]].name}` : MODELS[n.model].name}`;
  return `${n.title} — ${modelName(n)} — ${n.date}`;
};
const GTHEME = {
  dark: { fill: { grok: '#f4f4f5', gpt: '#2f63e8', claude: '#e2733f' }, me: '#d4d4d8', link: '170,170,185', label: '#e8e8ea', sub: '#9a9aa5', ring: '#ffffff', outline: null },
  light: { fill: { grok: '#ffffff', gpt: '#2f63e8', claude: '#e2733f' }, me: '#b9bdc9', link: '70,75,95', label: '#1c1d28', sub: '#6b6f80', ring: '#111119', outline: 'rgba(20,20,40,.45)' },
};
const LINK_BASE = { spoke: 0.3, chat: 0.26, related: 0.09 };

function GraphView({ onOpen, theme }) {
  const wrap = useRef(null), cv = useRef(null), size = useRef({ w: 800, h: 600, dpr: 1 });
  const [tip, setTip] = useState(null);
  const [filter, setFilter] = useState('all');
  const [range, setRange] = useState('any');
  const [menu, setMenu] = useState(false);
  const [labels, setLabels] = useState(false);
  const opts = useRef({}); opts.current = { filter, range, labels, theme };

  useEffect(() => {
    const g = getGraph(), canvas = cv.current, ctx = canvas.getContext('2d');
    let raf;
    const resize = () => {
      const r = wrap.current.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
      size.current = { w: r.width, h: r.height, dpr };
      canvas.width = r.width * dpr; canvas.height = r.height * dpr;
      canvas.style.width = r.width + 'px'; canvas.style.height = r.height + 'px';
      if (!g.fitted && r.width > 0) { fitView(g, r.width, r.height); g.fitted = true; }
    };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(wrap.current);

    const frame = () => {
      const { w, h, dpr } = size.current, o = opts.current, T = GTHEME[o.theme] || GTHEME.dark;
      if (g.alpha > 0.012) tick(g);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const { x: vx, y: vy, k } = g.view;
      ctx.translate(w / 2 + vx, h / 2 + vy); ctx.scale(k, k);
      const focus = g.hover && g.hover.kind === 'hub' ? g.hover.id : null;

      ctx.lineWidth = 1 / k;
      for (const l of g.links) {
        let a = LINK_BASE[l.type] * Math.min(visAlpha(l.a, o), visAlpha(l.b, o));
        if (focus) a = inFocus(l.a, focus) && inFocus(l.b, focus) ? Math.min(1, a * (l.type === 'spoke' ? 2.4 : 1.7)) : a * 0.5;
        ctx.strokeStyle = `rgba(${T.link},${a})`;
        ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
      }
      for (const n of g.nodes) {
        const hov = g.hover === n;
        const r = n.r * (hov ? 1.2 : 1);
        ctx.globalAlpha = visAlpha(n, o) * (inFocus(n, focus) ? 1 : 0.5);
        if (n.pair) {
          ctx.fillStyle = T.fill[n.pair[0]]; ctx.beginPath(); ctx.arc(n.x, n.y, r, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); ctx.fill();
          ctx.fillStyle = T.fill[n.pair[1]]; ctx.beginPath(); ctx.arc(n.x, n.y, r, -Math.PI / 2, Math.PI / 2); ctx.closePath(); ctx.fill();
        } else {
          ctx.fillStyle = n.kind === 'center' ? T.me : T.fill[n.model]; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832); ctx.fill();
        }
        if (T.outline) { ctx.strokeStyle = T.outline; ctx.lineWidth = 1 / k; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.2832); ctx.stroke(); }
        if (hov) { ctx.strokeStyle = T.ring; ctx.lineWidth = 1.5 / k; ctx.beginPath(); ctx.arc(n.x, n.y, r + 3 / k, 0, 6.2832); ctx.stroke(); }
        ctx.lineWidth = 1 / k;
        ctx.textAlign = 'center';
        if (n.kind === 'hub') {
          ctx.font = `600 ${13 / k}px Inter, sans-serif`; ctx.fillStyle = T.label;
          n.lines.forEach((ln, i) => ctx.fillText(ln, n.x, n.y + r + (17 + i * 15) / k));
        } else if (n.kind === 'center') {
          ctx.font = `500 ${13 / k}px Inter, sans-serif`; ctx.fillStyle = T.label;
          ctx.fillText(n.label, n.x, n.y + r + 17 / k);
        } else if (n.kind === 'chat' && o.labels) {
          ctx.font = `${10 / k}px Inter, sans-serif`; ctx.fillStyle = T.sub; ctx.textAlign = 'left';
          ctx.fillText(n.title, n.x + r + 4 / k, n.y + 3 / k);
        }
      }
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);

    const onWheel = (e) => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left - r.width / 2, my = e.clientY - r.top - r.height / 2;
      const k0 = g.view.k, k1 = clamp(k0 * Math.exp(-e.deltaY * 0.0015), 0.35, 4);
      g.view.x = mx - (mx - g.view.x) * (k1 / k0); g.view.y = my - (my - g.view.y) * (k1 / k0); g.view.k = k1;
    };
    canvas.addEventListener('wheel', onWheel, { passive: false });
    return () => { cancelAnimationFrame(raf); ro.disconnect(); canvas.removeEventListener('wheel', onWheel); };
  }, []);

  const toWorld = (e) => {
    const g = getGraph(), r = cv.current.getBoundingClientRect();
    return { sx: e.clientX - r.left, sy: e.clientY - r.top, x: (e.clientX - r.left - r.width / 2 - g.view.x) / g.view.k, y: (e.clientY - r.top - r.height / 2 - g.view.y) / g.view.k };
  };
  const pick = (p) => {
    const g = getGraph(); let best = null, bd = 1e9;
    for (const n of g.nodes) {
      if (visAlpha(n, opts.current) < 0.3) continue;
      const d = Math.hypot(n.x - p.x, n.y - p.y), rr = Math.max(n.r + 3, 7 / g.view.k);
      if (d < rr && d < bd) { best = n; bd = d; }
    }
    return best;
  };
  const onDown = (e) => {
    e.currentTarget.setPointerCapture(e.pointerId);
    const g = getGraph(), n = pick(toWorld(e));
    g.press = { n, sx: e.clientX, sy: e.clientY, vx: g.view.x, vy: g.view.y, moved: false };
  };
  const onMove = (e) => {
    const g = getGraph(), p = toWorld(e), pr = g.press;
    if (pr) {
      if (Math.hypot(e.clientX - pr.sx, e.clientY - pr.sy) > 4) pr.moved = true;
      if (pr.moved) {
        if (pr.n && !pr.n.pinned) { pr.n.x = p.x; pr.n.y = p.y; pr.n.vx = pr.n.vy = 0; g.alpha = Math.max(g.alpha, 0.3); }
        else { g.view.x = pr.vx + (e.clientX - pr.sx); g.view.y = pr.vy + (e.clientY - pr.sy); }
      }
      setTip(null); return;
    }
    const n = pick(p); g.hover = n;
    setTip(n ? { n, x: p.sx, y: p.sy } : null);
  };
  const onUp = () => {
    const g = getGraph(), pr = g.press; g.press = null;
    if (pr && pr.moved && pr.n && pr.n.kind === 'hub') { pr.n.tx = pr.n.x; pr.n.ty = pr.n.y; }
    if (pr && !pr.moved && pr.n) onOpen(pr.n);
  };
  const onLeave = () => { const g = getGraph(); if (!g.press) g.hover = null; setTip(null); };
  const zoomBy = (f) => { const g = getGraph(); g.view.k = clamp(g.view.k * f, 0.35, 4); };
  const recenter = () => { const g = getGraph(), { w, h } = size.current; fitView(g, w, h); g.alpha = 0.8; };

  const FILTERS = [['all', 'All'], ['projects', 'Projects'], ['ai', 'AI']];
  const RANGES = { any: 'Date', 7: 'Last 7 days', 30: 'Last 30 days' };
  const g0 = GRAPH;
  const dragging = g0 && g0.press && g0.press.moved;
  const dot = 'h-2.5 w-2.5 rounded-full ring-1 ring-fg/25';

  return (
    <div ref={wrap} className="relative min-h-0 min-w-0 flex-1 overflow-hidden bg-ink-950">
      <canvas ref={cv} className={`absolute inset-0 touch-none ${tip ? 'cursor-pointer' : dragging ? 'cursor-grabbing' : 'cursor-grab'}`}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onLeave} />
      {/* top-left toggles */}
      <div className="absolute left-4 top-4 flex rounded-lg border border-fg/10 bg-ink-850 p-1 gap-1">
        <button title="Force layout (re-center)" onClick={recenter} className="grid h-8 w-10 place-items-center rounded-md bg-accent text-white"><Ico n="scatter" size={18} /></button>
        <button title="Show chat labels" onClick={() => setLabels((v) => !v)} className={`grid h-8 w-10 place-items-center rounded-md ${labels ? 'bg-fg/15 text-fg' : 'text-neutral-400 hover:text-fg'}`}><Ico n="share" size={18} /></button>
      </div>
      {/* top-right filters */}
      <div className="absolute right-4 top-4 flex items-center rounded-lg border border-fg/10 bg-ink-850 p-1 text-sm gap-0.5">
        {FILTERS.map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)} className={`rounded-md px-3 py-1.5 ${filter === k ? 'bg-fg/10 text-fg' : 'text-neutral-400 hover:text-fg'}`}>{l}</button>
        ))}
        <div className="relative">
          <button onClick={() => setMenu((v) => !v)} className={`flex items-center gap-1.5 rounded-md px-3 py-1.5 ${range !== 'any' ? 'bg-fg/10 text-fg' : 'text-neutral-400 hover:text-fg'}`}>{RANGES[range]} <Ico n="chevDown" size={14} /></button>
          {menu && (
            <div className="absolute right-0 top-full z-20 mt-2 w-40 rounded-lg border border-fg/10 bg-ink-800 p-1 shadow-xl">
              {Object.entries(RANGES).map(([k, l]) => (
                <button key={k} onClick={() => { setRange(k); setMenu(false); }} className="flex w-full items-center justify-between rounded-md px-3 py-1.5 text-left text-neutral-300 hover:bg-fg/5">{k === 'any' ? 'Any time' : l}{range === k && <Ico n="check" size={14} />}</button>
              ))}
            </div>
          )}
        </div>
      </div>
      {/* bottom-left controls */}
      <div className="absolute bottom-4 left-4 flex items-center gap-2 text-xs text-neutral-500">
        <button onClick={() => zoomBy(1 / 1.25)} className="grid h-7 w-7 place-items-center rounded-md border border-fg/10 bg-ink-850 hover:text-fg"><Ico n="minus" size={14} /></button>
        <button onClick={() => zoomBy(1.25)} className="grid h-7 w-7 place-items-center rounded-md border border-fg/10 bg-ink-850 hover:text-fg"><Ico n="plus" size={14} /></button>
        <span className="ml-1">Scroll to zoom · drag to pan · click a node to open</span>
      </div>
      {/* legend */}
      <div className="absolute bottom-14 right-4 flex items-center gap-3 rounded-lg border border-fg/10 bg-ink-850 px-4 py-2.5 text-[13px] text-neutral-300">
        <span className="flex items-center gap-1.5"><i className={dot} style={{ background: COL.grok }} />Grok Bot</span>
        <span className="text-neutral-600">/</span>
        <span className="flex items-center gap-1.5"><i className={dot} style={{ background: COL.gpt }} />ChatGPT</span>
        <span className="text-neutral-600">/</span>
        <span className="flex items-center gap-1.5"><i className={dot} style={{ background: COL.claude }} />Claude</span>
        <span className="text-neutral-600">/</span>
        <span className="flex items-center gap-1.5"><i className={dot} style={{ background: `linear-gradient(90deg, ${COL.gpt} 50%, ${COL.claude} 50%)` }} />Multi-AI</span>
      </div>
      {tip && (
        <div className="pointer-events-none absolute z-20 max-w-[230px] rounded-lg border border-fg/10 bg-ink-800/95 px-3 py-2 text-[12.5px] leading-snug text-neutral-100 shadow-xl"
          style={{ left: Math.min(tip.x + 16, (size.current.w || 800) - 240), top: tip.y + 16 }}>{tipText(tip.n)}</div>
      )}
    </div>
  );
}

function CodeBlock({ code }) {
  const re = /(\b(?:const|let|return|import|from|export|default|function|async|await)\b|'[^']*'|"[^"]*"|\/\/.*|\b\w+(?=\())/g;
  const parts = code.split(re);
  return (
    <pre className="my-2 overflow-x-auto rounded-lg border border-fg/10 bg-ink-950 px-3.5 py-3 font-mono text-[13px] leading-relaxed text-neutral-200">
      {parts.map((p, i) => {
        if (i % 2 === 0) return <span key={i}>{p}</span>;
        let c = 'var(--tk-fn)';
        if (/^(const|let|return|import|from|export|default|function|async|await)$/.test(p)) c = 'var(--tk-kw)';
        else if (/^['"]/.test(p)) c = 'var(--tk-str)';
        else if (p.startsWith('//')) c = 'var(--tk-cm)';
        return <span key={i} style={{ color: c }}>{p}</span>;
      })}
    </pre>
  );
}
function MsgText({ text }) {
  const segs = text.split(/```(?:\w+)?\n?/);
  return (
    <div className="text-[15px] leading-relaxed">
      {segs.map((s, i) => (i % 2 ? <CodeBlock key={i} code={s.replace(/\n$/, '')} /> : s.trim() ? <p key={i} className="whitespace-pre-wrap">{s.trim()}</p> : null))}
    </div>
  );
}

function IconBtn({ n, label, active, onClick, compact, tip = 'below' }) {
  const [muted, setMuted] = useState(false);
  const pos = tip === 'right' ? 'left-full top-1/2 ml-3 -translate-y-1/2' : 'left-1/2 top-full mt-1.5 -translate-x-1/4';

// A dropped-down bot: flies from its slot in the header, with its bubble fading/scaling in after it
function PetOut({ id, leaving, onBack, children }) {
  const btn = useRef(null), fly = useRef(null);
  React.useLayoutEffect(() => {
    const slot = document.querySelector(`[data-slot="${id}"]`);
    if (!slot || !btn.current || !fly.current) return;
    const a = slot.getBoundingClientRect(), b = btn.current.getBoundingClientRect();
    fly.current.style.setProperty('--fx', a.left + a.width / 2 - (b.left + b.width / 2) + 'px');
    fly.current.style.setProperty('--fy', a.top + a.height / 2 - (b.top + b.height / 2) + 'px');
  }, [id]);
  return (
    <div className="pointer-events-auto flex flex-col items-end gap-2">
      <button ref={btn} onClick={onBack} title="Send back to the dock" className="mr-4 block">
        <span ref={fly} className={`block ${leaving ? 'fly-out' : 'fly-in'}`}><span className="pet-float block"><Char id={id} size={72} /></span></span>
      </button>
      <div className={leaving ? 'bubble-out' : 'bubble-in'}>{children}</div>
    </div>
  );
}

function CommandPalette({ commands, onClose }) {
  const [q, setQ] = useState('');
  const [sel, setSel] = useState(0);
  const listRef = useRef(null);
  const needle = q.trim().toLowerCase();
  const list = commands.filter((c) => !needle || `${c.label} ${c.keywords || ''} ${c.group}`.toLowerCase().includes(needle));
  useEffect(() => { setSel(0); }, [q]);
  useEffect(() => { const el = listRef.current && listRef.current.querySelector('[data-sel="true"]'); if (el) el.scrollIntoView({ block: 'nearest' }); }, [sel]);
  const run = (c) => { onClose(); c.run(); };
  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSel((s) => Math.min(s + 1, list.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSel((s) => Math.max(s - 1, 0)); }
    else if (e.key === 'Enter' && list[sel]) { e.preventDefault(); run(list[sel]); }
  };
  return (
    <div className="fade-in fixed inset-0 z-[80] flex items-start justify-center bg-black/40 px-4 pt-[14vh]" onMouseDown={onClose}>
      <div onMouseDown={(e) => e.stopPropagation()} className="pop-in w-[560px] max-w-full overflow-hidden rounded-2xl border border-fg/10 bg-ink-800 shadow-2xl">
        <div className="flex items-center gap-3 border-b border-fg/10 px-4 py-3.5">
          <Ico n="search" size={19} className="text-neutral-400" />
          <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={onKey} placeholder="Search chats, switch model, open graph…"
            className="min-w-0 flex-1 bg-transparent text-[15px] text-neutral-100 outline-none placeholder:text-neutral-400" />
          <kbd className="rounded border border-fg/15 px-1.5 py-0.5 text-[11px] text-neutral-400">Esc</kbd>
        </div>
        <div ref={listRef} className="max-h-[340px] overflow-y-auto p-2">
          {list.length === 0 && <div className="px-3 py-6 text-center text-sm text-neutral-500">No matches</div>}
          {list.map((c, i) => (
            <React.Fragment key={c.id}>
              {(i === 0 || list[i - 1].group !== c.group) && <div className="px-3 pb-1 pt-2.5 text-[11px] uppercase tracking-wide text-neutral-500">{c.group}</div>}
              <button data-sel={i === sel} onMouseEnter={() => setSel(i)} onClick={() => run(c)}
                className={`flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-[14.5px] ${i === sel ? 'bg-fg/[.08] text-fg' : 'text-neutral-300'}`}>
                <Ico n={c.icon} size={18} className="shrink-0 text-neutral-400" />
                <span className="flex-1 truncate">{c.label}</span>
                {c.current && <Ico n="check" size={15} />}
                {c.hint && <kbd className="rounded border border-fg/15 px-1.5 py-0.5 text-[11px] text-neutral-400">{c.hint}</kbd>}
              </button>
            </React.Fragment>
          ))}
        </div>
      </div>
    </div>
  );
}

function SettingsModal({ theme, setTheme, onClose }) {
  const opt = (k, label, ic) => (
    <button onClick={() => setTheme(k)} aria-pressed={theme === k} className={`flex flex-1 items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm transition ${theme === k ? 'bg-accent text-white' : 'text-neutral-300 hover:bg-fg/5'}`}><Ico n={ic} size={16} />{label}</button>
  );
  return (
    <div className="fade-in fixed inset-0 z-[80] grid place-items-center bg-black/40 px-4" onMouseDown={onClose}>
      <div onMouseDown={(e) => e.stopPropagation()} className="pop-in w-[420px] max-w-full rounded-2xl border border-fg/10 bg-ink-800 p-6 shadow-2xl">
        <div className="flex items-center justify-between">
          <div className="text-lg font-medium text-neutral-100">Settings</div>
          <button onClick={onClose} aria-label="Close settings" className="text-neutral-400 hover:text-fg"><Ico n="x" size={18} /></button>
        </div>
        <div className="mt-5 text-[11px] uppercase tracking-wide text-neutral-500">Appearance</div>
        <div className="mt-2 flex gap-1 rounded-xl border border-fg/10 bg-ink-850 p-1">{opt('dark', 'Dark', 'moon')}{opt('light', 'Light', 'sun')}</div>
        <div className="mt-6 text-[11px] uppercase tracking-wide text-neutral-500">Keyboard shortcuts</div>
        <ul className="mt-2 space-y-2 text-sm text-neutral-300">
          {[[MOD + 'K', 'Command palette'], [MOD + 'N', 'New chat'], [MOD + 'G', 'Open / close the graph'], [MOD + 'B', 'Collapse / expand sidebar'], ['Esc', 'Close palette or open bot']].map(([k, d]) => (
            <li key={k} className="flex items-center justify-between"><span>{d}</span><kbd className="rounded border border-fg/15 px-1.5 py-0.5 text-[11px] text-neutral-400">{k}</kbd></li>
          ))}
        </ul>
        <div className="mt-6 flex justify-end"><Btn primary onClick={onClose}>Done</Btn></div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('chat');
  const [theme, setThemeState] = useState(() => { try { return localStorage.getItem('trio-theme') === 'light' ? 'light' : 'dark'; } catch (e) { return 'dark'; } });
  const [collapsed, setCollapsed] = useState(() => { try { return localStorage.getItem('trio-sidebar') === 'collapsed'; } catch (e) { return false; } });
  useEffect(() => { try { localStorage.setItem('trio-sidebar', collapsed ? 'collapsed' : 'expanded'); } catch (e) { /* storage unavailable */ } }, [collapsed]);
  const toggleSidebar = () => setCollapsed((c) => !c);
  const [palette, setPalette] = useState(false);
  const [settings, setSettings] = useState(false);
  useEffect(() => {
    document.documentElement.classList.toggle('light', theme === 'light');
    try { localStorage.setItem('trio-theme', theme); } catch (e) { /* storage unavailable */ }
  }, [theme]);
  const setTheme = (t) => {
    const el = document.documentElement;
    el.classList.add('theme-fade'); setThemeState(t);
    setTimeout(() => el.classList.remove('theme-fade'), 320);
  };
  const [chats, setChats] = useState(INITIAL_CHATS);
  const [recent, setRecent] = useState(['c0', 'c1', 'c2', 'c3']);
  const [activeId, setActiveId] = useState('c0');
  const [model, setModel] = useState('auto');
  const [typing, setTyping] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [pets, setPets] = useState({ grok: 'docked', gpt: 'docked', claude: 'docked' });
  const [grokNotify, setGrokNotify] = useState(false);
  const [fileReq, setFileReq] = useState(false);
  const toastTimer = useRef(null);

  const toast = useCallback((m) => { setToastMsg(m); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastMsg(null), 2600); }, []);

  /* pets */
  // Only one bot may be open: opening one sends any other open bot back to its dock spot first.
  const sendOut = (id) => {
    setPets((p) => Object.fromEntries(Object.entries(p).map(([k, v]) => [k, k === id ? 'out' : v === 'out' ? 'leaving' : v])));
    setTimeout(() => setPets((p) => Object.fromEntries(Object.entries(p).map(([k, v]) => [k, v === 'leaving' ? 'docked' : v]))), 280);
  };
  const sendBack = (id) => {
    setPets((p) => (p[id] === 'out' ? { ...p, [id]: 'leaving' } : p));
    setTimeout(() => setPets((p) => (p[id] === 'leaving' ? { ...p, [id]: 'docked' } : p)), 280);
  };
  const sendAllBack = () => {
    setPets((p) => Object.fromEntries(Object.entries(p).map(([k, v]) => [k, v === 'out' ? 'leaving' : v])));
    setTimeout(() => setPets((p) => Object.fromEntries(Object.entries(p).map(([k, v]) => [k, v === 'leaving' ? 'docked' : v]))), 280);
  };
  // keyboard shortcuts (handler is re-assigned each render so it always sees fresh state)
  const keyHandler = useRef(null);
  useEffect(() => {
    const h = (e) => keyHandler.current && keyHandler.current(e);
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);
  const simNotif = () => setGrokNotify(true);
  const simFile = () => { setFileReq(true); sendOut('claude'); };

  /* chats */
  const newChat = () => {
    const id = 'n' + Date.now();
    setChats((c) => ({ ...c, [id]: { id, title: 'New chat', icon: 'chat', messages: [] } }));
    setRecent((r) => [id, ...r]); setActiveId(id); setView('chat');
  };
  const toggleGraph = () => setView((v) => (v === 'graph' ? 'chat' : 'graph'));
  const openNode = (n) => {
    const src = n;
    let id = 'g-' + src.id;
    if (!chats[id]) {
      let msgs, title;
      if (src.kind === 'chat') {
        title = src.title;
        const m = src.pair ? src.pair[0] : src.model;
        msgs = [{ role: 'user', text: `Let's pick up where we left off on "${src.title}".` }, { role: 'assistant', model: m, text: `Sure — last time (${src.date}) we were working on ${src.title.toLowerCase()} for ${src.project}. ${fakeReply(m, src.title)}` }];
      } else {
        title = src.kind === 'hub' ? src.label : 'Me';
        msgs = [{ role: 'assistant', model: 'claude', text: src.kind === 'hub' ? `Project overview: ${src.label} has ${src.count} chats across the assistants. Ask me for a summary or the next steps.` : 'This is you: who you are, what you’re working on, and how you like to work. Every project in the graph connects back here.' }];
      }
      setChats((c) => ({ ...c, [id]: { id, title, icon: 'chat', messages: msgs } }));
    }
    setRecent((r) => [id, ...r.filter((x) => x !== id)]);
    setActiveId(id); setView('chat');
    if (src.kind === 'chat') setModel(src.pair ? 'auto' : src.model);
  };
  const send = (text) => {
    const chatId = activeId, m = resolveModel(model, text);
    setChats((c) => {
      const ch = c[chatId];
      return { ...c, [chatId]: { ...ch, title: ch.messages.length === 0 ? snippet(text).slice(0, 28) : ch.title, messages: [...ch.messages, { role: 'user', text }] } };
    });
    setRecent((r) => [chatId, ...r.filter((x) => x !== chatId)]);
    setTyping({ chatId, model: m });
    setTimeout(() => {
      setChats((c) => ({ ...c, [chatId]: { ...c[chatId], messages: [...c[chatId].messages, { role: 'assistant', model: m, text: fakeReply(m, text) }] } }));
      setTyping((t) => (t && t.chatId === chatId ? null : t));
    }, 900 + Math.random() * 600);
  };

  keyHandler.current = (e) => {
    if (e.key === 'Escape') {
      if (palette) setPalette(false);
      else if (settings) setSettings(false);
      else sendAllBack();
      return;
    }
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'k') { e.preventDefault(); setSettings(false); setPalette((v) => !v); }
    else if (k === 'n') { e.preventDefault(); setPalette(false); newChat(); }
    else if (k === 'g') { e.preventDefault(); setPalette(false); toggleGraph(); }
    else if (k === 'b') { e.preventDefault(); toggleSidebar(); }
  };
  const commands = [
    { id: 'new', group: 'Actions', label: 'New chat', icon: 'edit', hint: MOD + 'N', run: newChat },
    { id: 'graph', group: 'Actions', label: view === 'graph' ? 'Close chat graph' : 'Open chat graph', keywords: 'graph map network', icon: 'graph', hint: MOD + 'G', run: toggleGraph },
    ...['auto', ...MODEL_KEYS].map((k) => ({ id: 'm-' + k, group: 'Model', label: `Switch model: ${k === 'auto' ? 'Auto' : MODELS[k].name}`, icon: 'at', current: model === k, run: () => setModel(k) })),
    ...recent.map((id) => ({ id: 'c-' + id, group: 'Chats', label: chats[id].title, keywords: chats[id].messages.map((m) => m.text).join(' '), icon: chats[id].icon || 'chat', run: () => { setActiveId(id); setView('chat'); } })),
  ];

  const chat = chats[activeId];
  const slot = (id) => {
    const st = pets[id];
    const badge = (id === 'grok' && grokNotify) || (id === 'claude' && fileReq);
    return (
      <div key={id} data-slot={id} className="relative h-6 w-6">
        {st === 'docked' ? (
          <button title={PET_NAMES[id]} onClick={() => sendOut(id)} className="lift relative grid h-6 w-6 place-items-center">
            <span className={id === 'grok' && grokNotify ? 'pet-bounce block' : 'block'}><Char id={id} size={24} /></span>
            {badge && <i className="absolute -right-1 -top-1 h-2 w-2 rounded-full border border-ink-900 bg-red-500" />}
          </button>
        ) : (
          <button title={`Send ${PET_NAMES[id]} back`} onClick={() => sendBack(id)} className="outline-in h-6 w-6 rounded-lg border-2 border-dashed border-neutral-500 transition-colors hover:border-fg" aria-label={`Return ${PET_NAMES[id]} to the dock`} />
        )}
      </div>
    );
  };
  const demoBtn = (label, onClick) => (
    <button onClick={onClick} className="rounded-full border border-fg/10 bg-ink-850 px-3.5 py-1.5 text-xs text-neutral-300 hover:border-fg/25 hover:text-fg">{label}</button>
  );

  return (
    <div className="flex h-dvh w-full flex-col overflow-hidden bg-ink-950 font-sans text-neutral-200">
      <div className="relative flex min-h-0 flex-1 overflow-hidden bg-ink-900">
        <Sidebar view={view} onNew={newChat} onGraph={toggleGraph} chats={chats} recent={recent}
          activeId={activeId} onSelect={(id) => { setActiveId(id); setView('chat'); }} onProject={(p) => openNode(getGraph().byId[p.id])} onSettings={() => setSettings(true)} collapsed={collapsed} onToggle={toggleSidebar} toast={toast} />
        <div className={`flex min-h-0 min-w-0 flex-col ${view === 'graph' ? 'flex-1' : 'flex-[58_1_0%]'}`}>
          {/* slim header with the dock */}
          <div className="relative z-10 flex h-11 shrink-0 items-center justify-center border-b border-fg/[.07] bg-ink-900">
            <div className="flex h-8 items-center gap-5 rounded-full border border-fg/10 bg-ink-850 px-4">{MODEL_KEYS.map(slot)}</div>
          </div>
          <div className={view === 'graph' ? 'hidden' : 'flex min-h-0 flex-1'}>
            <ChatView key={activeId} chat={chat} model={model} setModel={setModel} typing={typing && typing.chatId === activeId ? typing.model : null}
              onSend={send} onVoice={() => sendOut('gpt')} toast={toast} />
          </div>
          {view === 'graph' && <GraphView onOpen={openNode} theme={theme} />}
        </div>
        <BrowserPanel toast={toast} hide={view === 'graph'} />
        {/* demo toolbar, floating over the bottom-right of the main panel */}
        <div className="absolute bottom-3 right-3 z-40 flex items-center gap-2">
          {demoBtn('Simulate notification', simNotif)}
          {demoBtn('Simulate file request', simFile)}
        </div>
      </div>

      {/* pets dropped to the top right */}
      <div className="pointer-events-none fixed right-5 top-4 z-50 flex flex-col items-end gap-3">
        {MODEL_KEYS.filter((id) => pets[id] !== 'docked').map((id) => (
          <PetOut key={id} id={id} leaving={pets[id] === 'leaving'} onBack={() => sendBack(id)}>
            {id === 'grok' && (
              <Bubble>
                {grokNotify ? (<>
                  <div className="font-medium">New Slack message from Terri</div>
                  <div className="mt-1 text-sm text-neutral-400">“Hey, do you have a minute to look at the offsite agenda?”</div>
                  <div className="mt-3 flex gap-2"><Btn primary onClick={() => { setGrokNotify(false); sendBack('grok'); toast('Opened Slack · Terri'); }}>Open</Btn><Btn onClick={() => { setGrokNotify(false); sendBack('grok'); }}>Dismiss</Btn></div>
                </>) : (<>
                  <div className="font-medium">All caught up</div>
                  <div className="mt-1 text-sm text-neutral-400">No new notifications. Use “Simulate notification” to see one.</div>
                  <div className="mt-3"><Btn onClick={() => sendBack('grok')}>Close</Btn></div>
                </>)}
              </Bubble>
            )}
            {id === 'gpt' && <VoicePanel onEnd={() => sendBack('gpt')} />}
            {id === 'claude' && (
              <Bubble>
                {fileReq ? (<>
                  <div className="font-medium">Claude wants to read 2 files</div>
                  <ul className="mt-2 space-y-1.5 font-mono text-[12.5px] text-neutral-300">
                    {['src/components/Dashboard.tsx', 'package.json'].map((f) => <li key={f} className="flex items-center gap-2 rounded-md bg-fg/5 px-2.5 py-1.5"><Ico n="file" size={14} />{f}</li>)}
                  </ul>
                  <div className="mt-3 flex gap-2"><Btn primary onClick={() => { setFileReq(false); sendBack('claude'); toast('Allowed: Claude can read 2 files'); }}>Allow</Btn><Btn onClick={() => { setFileReq(false); sendBack('claude'); toast('Denied file access'); }}>Deny</Btn></div>
                </>) : (<>
                  <div className="font-medium">No pending requests</div>
                  <div className="mt-1 text-sm text-neutral-400">Claude will ask here before it opens any files.</div>
                  <div className="mt-3"><Btn onClick={() => sendBack('claude')}>Close</Btn></div>
                </>)}
              </Bubble>
            )}
          </PetOut>
        ))}
      </div>

      {palette && <CommandPalette commands={commands} onClose={() => setPalette(false)} />}
      {settings && <SettingsModal theme={theme} setTheme={setTheme} onClose={() => setSettings(false)} />}

      {toastMsg && <div key={toastMsg} className="toast fixed bottom-6 left-1/2 z-[60] rounded-full border border-fg/10 bg-ink-700 px-4 py-2 text-sm text-neutral-100 shadow-xl">{toastMsg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
